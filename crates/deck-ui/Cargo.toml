[package]
name = "deck-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Agent Deck UI: protocol, layout and software rendering, independent of the hardware"
publish = false

[dependencies]

[build-dependencies]
fontdue = "0.9.5"

[dev-dependencies]
png = "0.18.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pixel maths converts between ints and floats all the time; these would be pure noise here.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
float_cmp = "allow"
# Drawing calls take geometry + colour + alpha; screens are long but linear.
too_many_arguments = "allow"
too_many_lines = "allow"
many_single_char_names = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# The per-pixel helpers in gfx.rs are forced inline on purpose: measured on the device.
inline_always = "allow"

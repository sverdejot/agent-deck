version: 2

updates:
  - package-ecosystem: cargo
    directory: /firmware
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # esp-idf-svc / -hal / -sys and embuild must move together
      esp-idf:
        patterns: ["esp-idf-*", "embuild"]
      other:
        patterns: ["*"]
        exclude-patterns: ["esp-idf-*", "embuild"]

  - package-ecosystem: cargo
    directory: /crates/deck-ui
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /host
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      all:
        patterns: ["*"]

  # semantic-release and its preset (used by the release workflow)
  - package-ecosystem: npm
    directory: /.github/release
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      all:
        patterns: ["*"]
    ignore:
      # 10.x needs conventional-changelog-writer 9; @semantic-release/release-notes-generator
      # (14.x) still ships writer 8, and the release fails generating notes. Lift once it moves.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]

  # keeps the SHA-pinned actions (and their version comments) up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      all:
        patterns: ["*"]

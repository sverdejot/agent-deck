version: 2

updates:
  - package-ecosystem: cargo
    directory: /firmware
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # esp-idf-svc / -hal / -sys and embuild must move together
      esp-idf:
        patterns: ["esp-idf-*", "embuild"]
      other:
        patterns: ["*"]
        exclude-patterns: ["esp-idf-*", "embuild"]

  - package-ecosystem: cargo
    directory: /crates/deck-ui
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /host
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      all:
        patterns: ["*"]

  # keeps the SHA-pinned actions (and their version comments) up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      all:
        patterns: ["*"]
